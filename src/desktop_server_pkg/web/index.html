<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工创赛 · 画面预览</title>
<style>
body{background:#15191e;color:#e6e9ee;font:16px system-ui;margin:30px auto;padding:0 16px;max-width:800px}
img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#0c1014}
section{margin:16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,input{font:inherit;padding:6px 10px}input{width:4em}
</style>
</head>
<body>
<h1>工创赛画面</h1>
<img id="preview" alt="等待画面">
<section>
<button id="camera" hidden>使用电脑摄像头</button>
<label>JPEG 质量 <input id="quality" type="number" min="25" max="90" value="65"></label>
<button id="apply">应用</button>
<span id="message" role="status"></span>
</section>
<p id="status">连接中</p>
<script>
const preview = document.querySelector('#preview');
const camera = document.querySelector('#camera');
const quality = document.querySelector('#quality');
const message = document.querySelector('#message');
const status = document.querySelector('#status');
const headers = {'X-Gongchuang-Client': 'web'};
const video = document.createElement('video');
const canvas = document.createElement('canvas');
const context = canvas.getContext('2d');
let stream, timer;
let settingLoaded = false;
let previewRetry;
preview.onerror = () => {
  clearTimeout(previewRetry);
  previewRetry = setTimeout(() => { preview.src = '/video?t=' + Date.now(); }, 1500);
};
preview.src = '/video';
async function refresh() {
  try {
    const reply = await fetch('/status', {cache: 'no-store'});
    if (!reply.ok) throw Error();
    const data = await reply.json();
    camera.hidden = data.camera_source !== 'browser';
    if (!settingLoaded) { quality.value = data.jpeg_quality; settingLoaded = true; }
    status.textContent = '阶段：' + data.task.stage;
  } catch { status.textContent = '服务已断开'; }
}
async function sendFrame() {
  if (!stream) return;
  const active = stream;
  const start = performance.now();
  try {
    const ratio = Math.min(1, 1280 / video.videoWidth, 720 / video.videoHeight);
    if (video.videoWidth) {
      canvas.width = Math.round(video.videoWidth * ratio);
      canvas.height = Math.round(video.videoHeight * ratio);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const jpeg = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .8));
      if (jpeg && stream === active) {
        const response = await fetch('/camera', {method:'POST', headers, body:jpeg});
        if (!response.ok && response.status !== 429) throw Error(response.status);
      }
    }
  } catch { message.textContent = '摄像头画面上传失败'; }
  if (stream === active) timer = setTimeout(sendFrame, Math.max(0, 100 - (performance.now() - start)));
}
function stopCamera() {
  clearTimeout(timer);
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = undefined;
  video.srcObject = null;
  camera.textContent = '使用电脑摄像头';
}
camera.onclick = async () => {
  if (stream) { stopCamera(); return; }
  camera.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280}, height:{ideal:720}}, audio:false});
    video.srcObject = stream;
    await video.play();
    camera.textContent = '停止电脑摄像头';
    message.textContent = '';
    sendFrame();
  } catch (error) {
    stopCamera();
    message.textContent = '无法打开摄像头：' + error.message;
  } finally { camera.disabled = false; }
};
document.querySelector('#apply').onclick = async () => {
  if (!quality.reportValidity()) return;
  try {
    const response = await fetch('/settings', {method:'POST', headers, body:new URLSearchParams({jpeg_quality:quality.value})});
    if (!response.ok) throw Error();
    const data = await response.json();
    message.textContent = '已应用 JPEG 质量 ' + data.jpeg_quality;
  } catch { message.textContent = '设置失败'; }
};
window.addEventListener('pagehide', stopCamera);
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
