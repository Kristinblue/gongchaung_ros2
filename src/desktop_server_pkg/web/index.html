<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工创赛 · 画面预览</title>
<style>
body{background:#15191e;color:#e6e9ee;font:16px system-ui;margin:30px auto;padding:0 16px;max-width:800px}
img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#0c1014}
section{margin:16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,input{font:inherit;padding:6px 10px}input{width:4em}
</style>
</head>
<body>
<h1>工创赛画面</h1>
<img id="preview" alt="无视频输入">
<section>
<label>JPEG 质量 <input id="quality" type="number" min="25" max="90" value="65"></label>
<label id="threshold" hidden>YOLO 置信度 <input id="confidence" type="number" min="0" max="1" step="0.01"></label>
<button id="apply">应用</button>
<span id="message" role="status"></span>
</section>
<p id="status">连接中</p>
<script>
const preview = document.querySelector('#preview');
const quality = document.querySelector('#quality');
const threshold = document.querySelector('#threshold');
const confidence = document.querySelector('#confidence');
const message = document.querySelector('#message');
const status = document.querySelector('#status');
const headers = {'X-Gongchuang-Client': 'web'};
let settingLoaded = false;
preview.onerror = () => { preview.removeAttribute('src'); };
async function refresh() {
  try {
    const reply = await fetch('/status', {cache: 'no-store'});
    if (!reply.ok) throw Error();
    const data = await reply.json();
    if (!settingLoaded) { quality.value = data.jpeg_quality; settingLoaded = true; }
    const hasDetector = typeof data.confidence === 'number';
    if (hasDetector && threshold.hidden) confidence.value = data.confidence;
    threshold.hidden = !hasDetector;
    if (data.video_available && !preview.hasAttribute('src')) preview.src = '/video';
    if (!data.video_available) preview.removeAttribute('src');
    status.textContent = data.video_available ? '阶段：' + data.task.stage : '无视频输入';
  } catch { status.textContent = '服务已断开'; }
}
document.querySelector('#apply').onclick = async () => {
  if (!quality.reportValidity() || (!threshold.hidden && !confidence.reportValidity())) return;
  const fields = new URLSearchParams({jpeg_quality:quality.value});
  if (!threshold.hidden && confidence.value !== '') fields.set('confidence', confidence.value);
  try {
    const response = await fetch('/settings', {method:'POST', headers, body:fields});
    if (!response.ok) throw Error();
    const data = await response.json();
    quality.value = data.jpeg_quality;
    if (typeof data.confidence === 'number') confidence.value = data.confidence;
    message.textContent = '设置已应用';
  } catch { message.textContent = '设置失败'; }
};
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
